<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · RobertVs</title>
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      :root {
        --color-bg: #161d29;
        --color-surface: #202a3a;
        --color-primary: #6f9bb5;
        --color-primary-dark: #9ec4d8;
        --color-text: #eceef0;
        --color-text-muted: #9aa1a8;
        --color-text-on-primary: #14181b;
        --shadow-clay-raised: 0 6px 14px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 1.5rem;
      }

      .code {
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        color: var(--color-primary-dark);
        margin: 0;
        line-height: 1;
      }

      p {
        color: var(--color-text-muted);
        font-size: 1.05rem;
        margin: 0.75rem 0 2rem;
      }

      a {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-text-on-primary);
        font-weight: 600;
        text-decoration: none;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        box-shadow: var(--shadow-clay-raised);
      }
    </style>
  </head>
  <body>
    <div>
      <p class="code">404</p>
      <p>Esta página no existe — quizás el link está roto o mal escrito.</p>
      <a href="/">Volver al inicio</a>
    </div>
  </body>
</html>
